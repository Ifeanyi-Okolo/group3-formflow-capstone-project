server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS so "backend" resolves per-request, not at nginx
    # startup — avoids nginx crashing if backend isn't up yet/is restarting
    resolver 127.0.0.11 valid=10s;

    # Reverse proxy API calls to the backend service on the compose network
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (e.g. /events/:id/attendees) resolve
    location / {
        try_files $uri /index.html;
    }
}

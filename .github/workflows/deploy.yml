name: Build, Provision, Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/formflow-client:latest

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/formflow-server:latest

  provision:
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.tf.outputs.public_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event name: $GITHUB_EVENT_NAME"  
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init & apply
        id: tf
        working-directory: ./terraform
        run: |
          terraform init
          #terraform apply -auto-approve
          terraform destroy -auto-approve
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build-and-push, provision]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for instance to finish booting
        run: sleep 90

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.provision.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/formflow"

      - name: Debug secret presence (masked)
        run: |
          echo "DOCKERHUB_USERNAME length: ${#DOCKERHUB_USERNAME}"
          echo "MONGO_ROOT_USER length: ${#MONGO_ROOT_USER}"
          echo "APP_CLIENT_PORT length: ${#APP_CLIENT_PORT}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          APP_CLIENT_PORT: ${{ secrets.APP_CLIENT_PORT }}
      - name: Write .env on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          CLIENT_PORT: ${{ secrets.APP_CLIENT_PORT }}
          SERVER_PORT: ${{ secrets.APP_SERVER_PORT }}
        with:
          host: ${{ needs.provision.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/formflow
            cat > ~/formflow/.env << ENVEOF
            DOCKERHUB_USER=$DOCKERHUB_USER
            MONGO_ROOT_USER=$MONGO_ROOT_USER
            MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
            CLIENT_PORT=$CLIENT_PORT
            SERVER_PORT=$SERVER_PORT
            ENVEOF

      - name: Pull images and start containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.provision.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/formflow
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d
            docker compose -f docker-compose.yml ps
